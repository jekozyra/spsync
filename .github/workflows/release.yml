# Publish a GitHub release for each pushed vX.Y.Z tag. RELEASING.md describes the release steps.
#
# The release files:
#   spsync-macos-arm64.tar.gz         the standalone CLI from scripts/build_standalone.sh
#   spsync-macos-arm64.tar.gz.sha256  its SHA-256 checksum in shasum format; the plugin checks it
#   main.js, manifest.json            the Obsidian plugin; BRAT reads these two files by name
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  ARCHIVE: spsync-macos-arm64.tar.gz

jobs:
  release:
    # macos-15 runs on Apple silicon. The release ships only an arm64 build.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: obsidian-plugin/pnpm-lock.yaml

      # These checks run before the build, so a wrong tag or a missing changelog section fails fast.
      - name: Check the tag against the manifests
        run: uv run --no-project python scripts/check_versions.py --expect "${GITHUB_REF_NAME#v}"

      - name: Read the release notes from CHANGELOG.md
        run: uv run --no-project python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      - name: Build the plugin
        run: |
          pnpm -C obsidian-plugin install --frozen-lockfile
          pnpm -C obsidian-plugin run build

      - name: Build the CLI
        run: scripts/build_standalone.sh

      - name: Write the checksum
        working-directory: dist
        run: shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "spsync ${GITHUB_REF_NAME#v}"
          --notes-file "$RUNNER_TEMP/notes.md"
          "dist/$ARCHIVE"
          "dist/$ARCHIVE.sha256"
          obsidian-plugin/main.js
          obsidian-plugin/manifest.json
