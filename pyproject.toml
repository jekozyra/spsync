[project]
name = "spsync"
version = "0.1.0"
description = "Edit and comment on SharePoint Word documents as Obsidian notes"
readme = "README.md"
authors = [
    { name = "jekozyra", email = "jilliankozyra@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "merge3>=1.0.0",
    "msal>=1.39.0",
    "msal-extensions>=1.3.1",
    "python-docx>=1.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
spsync = "spsync:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
