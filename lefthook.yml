pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    ruff-check:
      glob: "*.py"
      run: uv run ruff check {staged_files}
    ty:
      glob: "*.py"
      run: uv run ty check
    anti-slop-python:
      glob: "*.py"
      run: uv run anti-slop-python {staged_files}
    pytest:
      glob: "*.{py,docx}"
      run: uv run pytest -q
    plugin-format:
      root: obsidian-plugin/
      glob: "*.{ts,json}"
      run: pnpm run format:check
    plugin-lint:
      root: obsidian-plugin/
      glob: "*.ts"
      run: pnpm run lint
    plugin-build:
      root: obsidian-plugin/
      glob: "*.{ts,json}"
      run: pnpm run build
